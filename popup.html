<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Workspace Links</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <!-- On pages that aren't a Google editor -->
    <main id="home" hidden>
      <section>
        <div class="list" data-group="drive"></div>
      </section>
      <section>
        <h2>Create new</h2>
        <div class="list" data-group="new"></div>
      </section>
    </main>

    <main id="actions" hidden>
      <section>
        <h2>Share as:</h2>
        <div class="list" data-group="link"></div>
      </section>
      <section>
        <h2>Download</h2>
        <div class="list" data-group="download"></div>
      </section>
    </main>

    <div id="snackbar" role="status" aria-live="polite">
      <span class="text"></span>
      <button class="action" type="button" hidden></button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
